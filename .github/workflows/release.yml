name: Docker build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/core/config.go)
          test "$RELEASE_TAG" = "v$version"
      - name: Test and build Windows EXE inside Docker
        run: bash build.sh
      - name: Validate PowerShell provisioning syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/internal/platform/bridge.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'Invalid provisioning script syntax' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LANPrint-windows-x64
          path: |
            LANPrint.exe
            LANPrint.exe.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LANPrint-windows-x64
      - name: Verify and publish EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check LANPrint.exe.sha256
          gh release create "$RELEASE_TAG" LANPrint.exe LANPrint.exe.sha256 --verify-tag --prerelease --title "LANPrint $RELEASE_TAG" --notes "Windows 10 x64. See README for supported formats, Hyper-V requirements and outstanding hardware acceptance checks."
